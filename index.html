<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Simulátor dilatace času</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0a0b10; background-image: radial-gradient(circle, #111424 0%, #0a0b10 100%); font-family: 'Courier New', monospace; color: white; display: flex; flex-direction: column; align-items: center; }
        .simulator-section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; }
        .clocks-container { display: flex; justify-content: center; align-items: center; gap: 60px; margin-bottom: 40px; }
        
        .clock-box { 
            background-color: #000000; 
            border: 3px solid white; 
            border-radius: 8px; 
            padding: 40px 30px; 
            width: 260px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        
        .clock-label { font-size: 1.4rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Ciferník hodin */
        .analog-clock { width: 140px; height: 140px; background-color: white; border-radius: 50%; position: relative; border: 4px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .analog-clock::after { content: ''; position: absolute; width: 10px; height: 10px; background-color: black; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; }
        
        .ticks { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .tick { position: absolute; width: 2px; height: 8px; background-color: #333; top: 2px; left: 69px; transform-origin: center 68px; }
        .tick.large { width: 4px; height: 14px; top: 0; left: 68px; background-color: #000; }

        /* NOVÉ: Bezpečné centrování ručiček přímo ze středu */
        .clock-hand { 
            position: absolute; 
            background-color: black; 
            bottom: 50%; 
            left: 50%; 
            transform-origin: bottom center; 
        }
        /* Minutová: šířka 4px, výška 45px. Odsazení vlevo o polovinu šířky (-2px) pro přesný střed */
        .hand-minute { width: 4px; height: 45px; margin-left: -2px; background-color: #333; }
        /* Vteřinová: šířka 2px, výška 58px. Odsazení vlevo o polovinu šířky (-1px) */
        .hand-second { width: 2px; height: 58px; margin-left: -1px; background-color: #d9534f; }

        .comparison-container { display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 1.4rem; margin-bottom: 45px; font-weight: bold; background-color: rgba(0,0,0,0.6); padding: 10px 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .comp-val { min-width: 100px; text-align: center; }
        .slider-wrapper { display: flex; align-items: center; gap: 20px; width: 80%; max-width: 800px; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px; border: 2px solid white; }
        .slider-label { font-size: 1.3rem; font-weight: bold; }
        .slider-container { flex-grow: 1; display: flex; align-items: center; }
        .custom-slider { -webkit-appearance: none; width: 100%; height: 15px; background: #333; outline: none; border: 2px solid white; border-radius: 5px; }
        .custom-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 30px; height: 30px; background: black; border: 2px solid white; cursor: pointer; border-radius: 4px; }
        .speed-display { font-size: 1.3rem; font-weight: bold; min-width: 90px; text-align: right; }
        .theory-section { min-height: 100vh; width: 100%; max-width: 900px; padding: 60px 20px; border-top: 3px dashed white; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="simulator-section">
        <div class="clocks-container">
            <!-- Observer -->
            <div class="clock-box">
                <div class="clock-label">Observer</div>
                <div class="analog-clock">
                    <div class="ticks" id="obs-ticks"></div>
                    <div class="clock-hand hand-minute" id="obs-hand-min"></div>
                    <div class="clock-hand hand-second" id="obs-hand-sec"></div>
                </div>
            </div>
            
            <!-- Traveler -->
            <div class="clock-box">
                <div class="clock-label">Traveler</div>
                <div class="analog-clock">
                    <div class="ticks" id="trav-ticks"></div>
                    <div class="clock-hand hand-minute" id="trav-hand-min"></div>
                    <div class="clock-hand hand-second" id="trav-hand-sec"></div>
                </div>
            </div>
        </div>

        <div class="comparison-container">
            <span class="comp-val">1 year</span>
            <span>=</span>
            <span class="comp-val" id="comparison-text">1.000 year</span>
        </div>

        <div class="slider-wrapper">
            <span class="slider-label">0c</span>
            <div class="slider-container">
                <input type="range" id="speed-slider" class="custom-slider" min="0" max="0.99" step="0.01" value="0">
            </div>
            <span class="slider-label">0.99c</span>
            <span class="speed-display" id="speed-val">v = 0.00c</span>
        </div>
    </div>

    <div class="theory-section">
        <h2>Teoretické vysvětlení</h2>
        <p>Zde bude tvůj text pro závěrečnou práci...</p>
    </div>

    <script>
        let observerTime = 0;
        let travelerTime = 0;
        let lastTimestamp = 0;

        const speedSlider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        const comparisonText = document.getElementById('comparison-text');
        
        const obsHandMin = document.getElementById('obs-hand-min');
        const obsHandSec = document.getElementById('obs-hand-sec');
        const travHandMin = document.getElementById('trav-hand-min');
        const travHandSec = document.getElementById('trav-hand-sec');

        function createClockTicks(containerId) {
            const container = document.getElementById(containerId);
            for (let i = 0; i < 12; i++) {
                const tick = document.createElement('div');
                tick.classList.add('tick');
                if (i % 3 === 0) tick.classList.add('large');
                tick.style.transform = `rotate(${i * 30}deg)`;
                container.appendChild(tick);
            }
        }
        createClockTicks('obs-ticks');
        createClockTicks('trav-ticks');

        function loop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            let elapsed = timestamp - lastTimestamp;
            if (elapsed > 100) elapsed = 16;
            lastTimestamp = timestamp;

            let currentSpeed = parseFloat(speedSlider.value || 0);
            let lorentz = Math.sqrt(1 - Math.pow(currentSpeed, 2));

            observerTime += elapsed;
            travelerTime += elapsed * lorentz;

            // NOVÉ: Čisté rotování bez kombinace s centrováním
            obsHandSec.style.transform = `rotate(${(observerTime / 1000) * 360}deg)`;
            obsHandMin.style.transform = `rotate(${(observerTime / 60000) * 360}deg)`;
            
            travHandSec.style.transform = `rotate(${(travelerTime / 1000) * 360}deg)`;
            travHandMin.style.transform = `rotate(${(travelerTime / 60000) * 360}deg)`;

            requestAnimationFrame(loop);
        }

        speedSlider.addEventListener('input', () => {
            let currentSpeed = parseFloat(speedSlider.value || 0);
            let lorentz = Math.sqrt(1 - Math.pow(currentSpeed, 2));
            speedVal.textContent = `v = ${currentSpeed.toFixed(2)}c`;
            comparisonText.textContent = `${lorentz.toFixed(3)} year`;
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
